version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# EGTS Telematics Platform
#
#  Usage:
#    cd deploy && docker-compose up -d
#
#  Ports:
#    5555  — EGTS TCP (devices connect here)
#    8080  — Kafka UI
#    8081  — WebSocket / REST API (wsserver)
#    3000  — Grafana  (admin / admin)
#    8123  — ClickHouse HTTP  (dev/tools)
#    9091  — Prometheus
#    9000  — ClickHouse native (internal)
#    6379  — Redis (internal)
#    80    — Frontend map (nginx)
# ─────────────────────────────────────────────────────────────────────────────

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:

# ══════════════════════════════════════════════════════════════════════════════
# STORAGE
# ══════════════════════════════════════════════════════════════════════════════

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    <<: [*restart, *logging]
    ports:
      - "8123:8123"   # HTTP  (curl, Grafana)
      - "9000:9000"   # native protocol (Go driver)
    environment:
      CLICKHOUSE_DB:       ${CLICKHOUSE_DB:-egts}
      CLICKHOUSE_USER:     ${CLICKHOUSE_USER:-egts}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-egts}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    <<: [*restart, *logging]
    command: redis-server --save "" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


# ══════════════════════════════════════════════════════════════════════════════
# MESSAGE BROKER
# ══════════════════════════════════════════════════════════════════════════════

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    <<: [*restart, *logging]
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID:                           1
      KAFKA_PROCESS_ROLES:                     broker,controller
      KAFKA_LISTENERS:                         PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:              PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS:          1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:         CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME:        PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:  1
      KAFKA_LOG_DIRS:                          /var/lib/kafka/data
      CLUSTER_ID:                              ${KAFKA_CLUSTER_ID:-egts-cluster-001}
      KAFKA_NUM_IO_THREADS:                    8
      KAFKA_NUM_NETWORK_THREADS:               5
      KAFKA_SOCKET_SEND_BUFFER_BYTES:          102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES:       102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES:          104857600
      KAFKA_LOG_RETENTION_HOURS:               168
      KAFKA_LOG_RETENTION_BYTES:               10737418240
      KAFKA_LOG_SEGMENT_BYTES:                 536870912
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic egts.raw --partitions 12 --replication-factor 1 \
        --config retention.ms=604800000 --config compression.type=lz4

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic egts.positions --partitions 12 --replication-factor 1 \
        --config retention.ms=604800000 --config compression.type=lz4

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic egts.events --partitions 6 --replication-factor 1 \
        --config retention.ms=2592000000 --config compression.type=lz4

      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic egts.dlq --partitions 1 --replication-factor 1 \
        --config retention.ms=604800000

      echo 'Kafka topics created'
      "
    restart: "no"


# ══════════════════════════════════════════════════════════════════════════════
# APPLICATION
# ══════════════════════════════════════════════════════════════════════════════

  egts-server:
    build:
      context: ..
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    ports:
      - "5555:5555"
      - "9090:9090"
    environment:
      EGTS_ADDR:         ${EGTS_ADDR:-:5555}
      EGTS_METRICS_ADDR: ${EGTS_METRICS_ADDR:-:9090}
      EGTS_MAX_CONN:     ${EGTS_MAX_CONN:-20000}
      KAFKA_BROKERS:     kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/metrics | head -1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  consumer:
    build:
      context: ..
      dockerfile: Dockerfile.consumer
    <<: [*restart, *logging]
    environment:
      KAFKA_BROKERS:     kafka:9092
      CLICKHOUSE_ADDR:   clickhouse:9000
      CLICKHOUSE_DB:     ${CLICKHOUSE_DB:-egts}
      CLICKHOUSE_USER:   ${CLICKHOUSE_USER:-egts}
      CLICKHOUSE_PASS:   ${CLICKHOUSE_PASSWORD:-egts}
      REDIS_ADDR:        redis:6379
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

  wsserver:
    build:
      context: ..
      dockerfile: Dockerfile.wsserver
    <<: [*restart, *logging]
    ports:
      - "8081:8081"
    environment:
      WS_ADDR:    :8081
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    ports:
      - "80:80"
    depends_on:
      wsserver:
        condition: service_healthy


# ══════════════════════════════════════════════════════════════════════════════
# OBSERVABILITY
# ══════════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.54.0
    <<: [*restart, *logging]
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:11.2.0
    <<: [*restart, *logging]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:       ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD:   ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED:    "false"
      GF_INSTALL_PLUGINS:           "grafana-worldmap-panel,grafana-clickhouse-datasource"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/egts.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - clickhouse
      - prometheus

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    <<: [*restart, *logging]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME:              local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS:  kafka:9092
      AUTH_TYPE:                          LOGIN_FORM
      SPRING_SECURITY_USER_NAME:          admin
      SPRING_SECURITY_USER_PASSWORD:      admin
    depends_on:
      kafka:
        condition: service_healthy


# ══════════════════════════════════════════════════════════════════════════════
# VOLUMES
# ══════════════════════════════════════════════════════════════════════════════

volumes:
  clickhouse_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local


networks:
  default:
    name: egts-platform
    driver: bridge
